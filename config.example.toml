# Copy to config.toml. API keys are never written here: set APCA_API_KEY_ID and APCA_API_SECRET_KEY
# in the environment (trade-only keys for the paper account).

timezone = "America/New_York"

[alpaca]
mode = "paper"                          # paper, live (also needs live_confirmed = true) or standin
base_url = "https://paper-api.alpaca.markets"
data_url = "https://data.alpaca.markets"
feed = "iex"                            # the free data feed

[risk]
max_position_pct = 5.0                  # one symbol may hold at most this share of equity
max_open_positions = 5
daily_loss_limit_pct = 2.0              # down this much since yesterday's close: flatten, then stop
stop_loss_pct = 3.0                     # every entry carries a stop this far under the fill
entry_pct = 2.5                         # the size the example rule asks for (never above max_position_pct)

[strategy]
watchlist = ["SPY", "QQQ", "AAPL", "MSFT", "NVDA"]
sma_days = 20

[alerts]
email_to = ""                           # leave empty to turn email off
email_from = ""
smtp_host = ""
smtp_port = 587
webhook_url = ""                        # a Slack style incoming webhook, for chat alerts
sms_to = ""                             # a text message to this number (+15558675310 style) through Twilio; leave empty to turn it off
sms_from = ""                           # a Twilio number the account owns. TWILIO_ACCOUNT_SID and TWILIO_AUTH_TOKEN go in the environment

[paths]
state_dir = "state"                     # ledger.jsonl, plan.json, KILL, dashboard.html

[options]                               # the options leg: one long call or put at a time, off until a person turns it on
enabled = false
max_premium_pct = 1.0                   # all option premium held plus the new order, as a share of equity
min_days_to_expiry = 7
max_days_to_expiry = 45
stop_premium_pct = 50.0                 # the exit rule: a stop this far under the entry premium
limit_buffer_pct = 5.0                  # the entry is a buy limit this far over the ask seen
feed = "indicative"                     # Alpaca's free options feed; "opra" needs a subscription

[market_data]
provider = "alpaca"                     # or "finnhub" (FINNHUB_API_KEY in the environment) or "polygon" (POLYGON_API_KEY in the environment)
finnhub_url = "https://finnhub.io"
polygon_url = "https://api.massive.com" # Polygon.io is now Massive; https://api.polygon.io is documented as serving the same API

[airtable]                              # one summary row per routine run, written with AIRTABLE_TOKEN from the environment
enabled = false
base_id = ""                            # python scripts/airtable_setup.py makes the table and prints the ids
table = "Ledgerbell run log (test)"     # a table name or a table id
