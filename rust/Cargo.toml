[package]
name = "bookwatch"
version = "0.1.0"
edition = "2021"
description = "Async order book client for a depth stream: snapshot plus deltas, gap detection, resync and reconnect, with a stand-in exchange to test against"
license = "MIT"
publish = false

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "signal"] }
tokio-tungstenite = "0.30"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
proptest = "1"
criterion = { version = "0.5", default-features = false, features = ["cargo_bench_support"] }

[[bench]]
name = "apply"
harness = false

[lints.rust]
unsafe_code = "forbid"
