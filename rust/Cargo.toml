[package]
name = "bookwatch"
version = "0.1.0"
edition = "2021"
description = "Async order book client for a depth stream, plus a worker fleet (Axum control server, Protobuf over WebSockets, SQLite WAL state), execution guards and EIP-712 signing, each tested against stand-in servers"
license = "MIT"
publish = false

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "signal"] }
tokio-tungstenite = "0.30"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio", "ws", "query"] }
prost = "0.14"
rusqlite = { version = "0.37", features = ["bundled"] }
sha3 = "0.12"
k256 = { version = "0.13", default-features = false, features = ["ecdsa", "std"] }
getrandom = "0.4"

[build-dependencies]
prost-build = "0.14"
protox = "0.10"

[dev-dependencies]
proptest = "1"
criterion = { version = "0.5", default-features = false, features = ["cargo_bench_support"] }

[[bench]]
name = "apply"
harness = false

[[bench]]
name = "fleet"
harness = false

[lints.rust]
unsafe_code = "forbid"
